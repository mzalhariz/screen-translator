name: Release APK

# NO manual tagging needed. Every push to main builds the APK and (re)publishes a single
# "latest" release. Permanent download link (never changes):
#   https://github.com/<owner>/<repo>/releases/latest/download/screen-translator.apk
#
# Under the hood CI maintains one moving tag named "latest" so the release has a ref to point
# at — you never create or push tags by hand.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases

jobs:
  release:
    name: Build + publish latest APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Fail loudly and early if the APK isn't where we expect (path is app/, NOT android-app/).
      - name: Verify APK exists
        run: ls -l app/build/outputs/apk/debug/app-debug.apk

      - name: Publish / refresh the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Remove the previous "latest" release AND its CI-managed tag so we can repoint it.
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag --repo "$REPO" || true
          fi
          gh release create latest \
            --target "${{ github.sha }}" \
            "app/build/outputs/apk/debug/app-debug.apk#screen-translator.apk" \
            --title "Screen Translator (latest)" \
            --notes "Auto-published from main on every push. Debug APK, installable." \
            --repo "$REPO"
