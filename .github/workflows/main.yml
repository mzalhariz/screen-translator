name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: no android-actions/setup-android here — that action is broken on current runner
      # images (it calls `sdkmanager tools`, a package that no longer exists). The ubuntu-latest
      # runner ships the Android SDK with licenses accepted, and AGP auto-installs any missing
      # platform/build-tools, so this step is unnecessary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk screen-translator-debug-apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest screen-translator-debug-apk \
            --target ${{ github.sha }} \
            --title "Latest debug build" \
            --notes "Built from commit ${{ github.sha }}"
